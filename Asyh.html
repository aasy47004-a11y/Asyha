<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kado Ulang Tahun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }

        #fireworksCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 400px;
            height: 400px;
        }

        .gift-box, .birthday-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.8s ease;
            cursor: pointer;
            backface-visibility: hidden;
        }

        /* --- KADO DIBUAT PAKAI CSS --- */
        .gift-box {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #ff4d4d 0%, #cc0000 100%);
            border-radius: 10px;
            z-index: 3;
            box-shadow: 0 0 30px rgba(255, 77, 77, 0.7), inset 0 0 20px rgba(0,0,0,0.2);
            position: relative;
            animation: bounceIn 1s ease;
            overflow: hidden;
        }

        /* Pita Kado */
        .gift-box::before,
        .gift-box::after {
            content: '';
            position: absolute;
            background: linear-gradient(90deg, #ffd700 0%, #fffacd 50%, #ffd700 100%);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .gift-box::before { 
            width: 100%; 
            height: 35px; 
            top: 50%; 
            left: 0;
            transform: translateY(-50%); 
        }
        .gift-box::after { 
            width: 35px; 
            height: 100%; 
            left: 50%; 
            top: 0;
            transform: translateX(-50%); 
        }

        /* Pita Hiasan Atas */
        .gift-box .bow {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 40px;
            z-index: 4;
        }
        .gift-box .bow::before,
        .gift-box .bow::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            border-radius: 50% 0;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
        .gift-box .bow::before { left: 0; transform: rotate(-45deg); }
        .gift-box .bow::after { right: 0; transform: rotate(45deg) scaleX(-1); }

        /* --- FOTO TEMAN --- */
        .birthday-text {
            opacity: 0;
            z-index: 2;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0) rotate(180deg);
            max-width: 90%;
            max-height: 90%;
        }

        .friend-photo {
            width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 215, 0, 0.6);
        }

        /* --- ANIMASI --- */
        @keyframes bounceIn {
            0% { transform: translate(-50%, -50%) scale(0); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .container.gift-opened .gift-box {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0) rotate(360deg);
        }

        .container.gift-opened .birthday-text {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1) rotate(0);
            animation: bounceIn 1s ease;
        }
    </style>
</head>
<body>
    <canvas id="fireworksCanvas"></canvas>

    <div class="container" id="mainContainer">
        <!-- Kado -->
        <div class="gift-box" id="giftBox">
            <div class="bow"></div>
        </div>
        
        <!-- FOTO TEMAN (SUDAH DIUBAH SESUAI NAMA FILE) -->
        <div class="birthday-text">
            <img src="https://raw.githubusercontent.com/aasy47004-a11y/Asyha/main/Foto.jpg" alt="Foto Teman" class="friend-photo">

        </div>
    </div>

    <script>
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        const mainContainer = document.getElementById('mainContainer');
        const giftBox = document.getElementById('giftBox');

        // Ukuran Canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- PETASAN WARNA-WARNI ---
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.speed = Math.random() * 6 + 4;
                this.angle = Math.random() * Math.PI * 2;
                this.color = color;
                this.alpha = 1;
                this.friction = 0.98;
                this.gravity = 0.05;
                this.spin = Math.random() * 0.2 - 0.1;
                this.size = Math.random() * 2 + 1;
            }

            update() {
                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.angle += this.spin;
                this.alpha -= 0.008;
            }

            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class Firework {
            constructor(x, y) {
                this.particles = [];
                this.colors = [
                    '#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF', '#00FFFF', 
                    '#FFA500', '#FFD700', '#FFFFFF', '#FF1493', '#00FF7F', '#1E90FF', 
                    '#FF4500', '#ADFF2F', '#FF69B4', '#BA55D3', '#00BFFF', '#F0E68C'
                ];
                
                for (let i = 0; i < 180; i++) {
                    const randomColor = this.colors[Math.floor(Math.random() * this.colors.length)];
                    this.particles.push(new Particle(x, y, randomColor));
                }
            }

            update() {
                this.particles.forEach((particle, index) => {
                    particle.update();
                    if (particle.alpha <= 0) {
                        this.particles.splice(index, 1);
                    }
                });
            }

            draw() {
                this.particles.forEach(particle => particle.draw());
            }
        }

        let fireworks = [];
        let animationStarted = false;

        function createFirework() {
            if (animationStarted) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height / 2;
                fireworks.push(new Firework(x, y));
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            fireworks.forEach((firework, index) => {
                firework.update();
                firework.draw();
                if (firework.particles.length === 0) {
                    fireworks.splice(index, 1);
                }
            });

            requestAnimationFrame(animate);
        }

        // Event Klik Kado
        giftBox.addEventListener('click', () => {
            if (!mainContainer.classList.contains('gift-opened')) {
                mainContainer.classList.add('gift-opened');
                animationStarted = true;
            }
        });

        animate();
        setInterval(createFirework, 800);
    </script>
</body>
</html>
